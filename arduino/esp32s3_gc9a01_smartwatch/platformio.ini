; ============================================================================
; FILE: /arduino/esp32s3_gc9a01_smartwatch/platformio.ini
; PROJECT: ChronoS3 — ESP32-S3-CAM + GC9A01 (240x240 Round Display) Smart Watch
; ============================================================================
; Works with both PlatformIO and Arduino IDE 2.x (esp32 core >= 2.0.x / 3.0.x)
;
; ARDUINO IDE "Tools" MENU SETTINGS:
;   - Board:            "ESP32S3 Dev Module" (or "XIAO_ESP32S3")
;   - CPU Frequency:    "240MHz (WiFi)" (Required by ESP32-S3 LCD_CAM for 20MHz Camera XCLK)
;   - Partition Scheme: "Huge APP (3MB No OTA/1MB SPIFFS)" (recommended for Cam + WiFi + BLE)
;   - PSRAM:            "OPI PSRAM"

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Use 3MB App partition, 240MHz CPU (for LCD_CAM 20MHz XCLK), and 8MB Octal PSRAM
board_build.partitions = huge_app.csv
board_build.arduino.memory_type = qio_opi
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -Os

lib_deps =
  moononournation/GFX Library for Arduino @ ^1.4.7
  bitbank2/JPEGDEC @ ^1.4.1
  https://github.com/pschatzmann/arduino-libhelix.git

